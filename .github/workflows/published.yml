name: Published package and endpoint
on:
  schedule:
    - cron: '19 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: published-plugin-check
  cancel-in-progress: false
jobs:
  published-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scripts/requirements-ci.txt
      - id: release
        name: Download public release and verify ZIP against its tag
        run: |
          python scripts/check_published.py release --output release-check.json
          python -c 'import json, os; f=open(os.environ["GITHUB_OUTPUT"], "a"); f.write("version=" + json.load(open("release-check.json"))["version"] + "\n"); f.close()'
      - uses: actions/upload-artifact@v4
        with:
          name: published-release-evidence
          path: release-check.json
  public-endpoint:
    needs: published-package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scripts/requirements-ci.txt
      - name: Compare public version and ten-tool catalogue with published package
        env:
          PACKAGE_VERSION: ${{ needs.published-package.outputs.version }}
        run: python scripts/check_published.py endpoint --version "$PACKAGE_VERSION" --output endpoint-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-endpoint-evidence
          path: endpoint-check.json

